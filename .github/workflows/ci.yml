name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - axera-dev
    paths-ignore:
      - "docs/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  axera_builds:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ax650
            name: AX650 Build
            runner: ubuntu-22.04-arm
            files: docker/axera/ax650.hcl
          - target: x86-axcl
            name: x86 AXCL Build
            runner: ubuntu-22.04
            files: docker/axcl/x86-axcl.hcl
          - target: rk-axcl
            name: Rockchip AXCL Build
            runner: ubuntu-22.04-arm
            files: |
              docker/rockchip/rk.hcl
              docker/axcl/rk-axcl.hcl
          - target: rpi-axcl
            name: RPi AXCL Build
            runner: ubuntu-22.04-arm
            files: |
              docker/rpi/rpi.hcl
              docker/axcl/rpi-axcl.hcl
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up QEMU and Buildx
        id: setup
        uses: ./.github/actions/setup
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: metadata
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${{ steps.setup.outputs.image-name }}-${{ matrix.target }}" >> "$GITHUB_ENV"
          echo "TAR_PATH=/var/lib/docker/frigate-artifacts/frigate-${{ matrix.target }}-${GITHUB_SHA::7}.tar" >> "$GITHUB_ENV"
          echo "image_name=${{ steps.setup.outputs.image-name }}-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Axera image
        uses: docker/bake-action@v7
        with:
          source: .
          push: true
          targets: ${{ matrix.target }}
          files: ${{ matrix.files }}
          set: |
            ${{ matrix.target }}.tags=${{ steps.metadata.outputs.image_name }}
            *.cache-from=type=registry,ref=${{ steps.setup.outputs.cache-name }}-${{ matrix.target }}
            *.cache-to=type=registry,ref=${{ steps.setup.outputs.cache-name }}-${{ matrix.target }},mode=max

      - name: Save Docker image as tar
        run: |
          sudo chmod 755 /var/lib/docker
          sudo mkdir -p "$(dirname "${TAR_PATH}")"
          sudo chown "${USER}:${USER}" "$(dirname "${TAR_PATH}")"
          docker pull "${IMAGE_NAME}"
          docker save "${IMAGE_NAME}" -o "${TAR_PATH}"
          ls -lh "${TAR_PATH}"

      - name: Upload Docker image tar
        uses: actions/upload-artifact@v7
        with:
          name: frigate-${{ matrix.target }}-docker-image
          path: /var/lib/docker/frigate-artifacts/frigate-${{ matrix.target }}-*.tar
          retention-days: 7
          compression-level: 0
